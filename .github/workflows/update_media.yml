name: Update Media Monitor

on:
  schedule:
    - cron: "0 6 * * *"   # runs daily at 06:00 UTC
  workflow_dispatch:

jobs:
  update-media:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pandas feedparser textblob plotly tableauserverclient tableauhyperapi

      - name: Run Media Monitor (update_articles.py)
        run: python media-monitor/update_articles.py

      - name: Upload Media Monitor outputs to Tableau
        env:
          PAT_NAME: ${{ secrets.TABLEAU_PAT_NAME }}
          PAT_SECRET: ${{ secrets.TABLEAU_PAT_SECRET }}
          SITE_NAME: ${{ secrets.TABLEAU_SITE_NAME }}
          PROJECT_ID: ${{ secrets.TABLEAU_PROJECT_ID }}
          TABLEAU_SERVER: ${{ secrets.TABLEAU_REST_URL }}
        run: python .github/scripts/upload_hyper_to_tableau.py

