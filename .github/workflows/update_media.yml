name: Update Media Monitor

on:
  schedule:
    - cron: "0 6 * * *"   # runs daily at 06:00 UTC
  workflow_dispatch:

jobs:
  update-media:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pandas feedparser textblob plotly

      - name: Run Media Monitor (update_articles.py)
        run: python .github/scripts/update_articles.py

      - name: Debug — list files
        run: |
          echo "PWD:"
          pwd
          echo "Files here:"
          ls -alh
          echo "Files in .github/scripts:"
          ls -alh .github/scripts || true

      - name: Commit and push updated outputs
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -f *.csv *.json *.html || true
          git commit -m "Auto-update media monitor outputs" || echo "No changes to commit"
          git push origin main

